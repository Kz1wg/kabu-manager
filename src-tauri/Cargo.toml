[package]
name = "kabu-manager"
version = "0.1.0"
description = "保有株管理アプリ(SBI証券/e-smart証券のCSV取り込み・SQLite記録・可視化)"
edition = "2024"

[lib]
name = "kabu_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
csv = "1.4.0"
encoding_rs = "0.8.40"
rusqlite = { version = "0.40.2", features = ["bundled"] }
chrono = "0.4"
thiserror = "2.0.20"
regex = "1.13.1"
